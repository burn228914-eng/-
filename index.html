<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Расписание</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 15px; min-height: 100vh; color: #1a1a1a; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 15px; font-size: 1.5em; }

  .date-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  input[type="date"] { padding: 6px 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }

  .quick-btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .quick-btn { padding: 6px 12px; border: 2px solid #2196f3; background: white; color: #2196f3; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .quick-btn.active, .quick-btn:hover { background: #2196f3; color: white; }

  .day-label { text-align: center; font-size: 1.1em; font-weight: 700; color: #1976d2; margin-bottom: 12px; padding: 8px; background: white; border-radius: 8px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 9px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
  .btn:hover { transform: translateY(-1px); }
  .btn-edit { background: #ff9800; color: white; }
  .btn-edit.on { background: #4caf50; }
  .btn-primary { background: #2196f3; color: white; }
  .btn-danger { background: #f44336; color: white; }
  .btn-add { background: #e3f2fd; color: #1976d2; padding: 10px; font-size: 14px; width: 100%; margin-top: 10px; }

  .status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-left: 8px; }
  .status.view { background: #e0e0e0; color: #555; }
  .status.edit { background: #c8e6c9; color: #2e7d32; }

  .table-wrap { background: white; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  th { background: #1a1a1a; color: white; padding: 10px 8px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  th.num { width: 40px; text-align: center; }
  th.time { width: 100px; }
  th.room { width: 60px; text-align: center; }
  th.hw { width: 22%; }
  th.files { width: 90px; text-align: center; }
  th.act { width: 40px; }

  td { padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: #f9f9f9; }
  td.num { text-align: center; font-weight: bold; color: #666; }
  td.room { text-align: center; font-weight: 600; color: #1976d2; }

  .cell-input { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 14px; padding: 4px; outline: none; color: #1a1a1a; line-height: 1.4; }
  .cell-input:read-only { cursor: default; }
  .edit-mode .cell-input { background: #fffde7; border: 1px dashed #ffc107; border-radius: 5px; }
  .edit-mode .cell-input:focus { background: #fff9c4; border-color: #ff9800; border-style: solid; }
  textarea.cell-input { min-height: 40px; resize: none; overflow: hidden; }

  .del-btn { background: #ffebee; color: #c62828; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 15px; font-weight: bold; line-height: 1; }
  .del-btn:hover { background: #ffcdd2; }
  .del-btn.hidden { visibility: hidden; }

  .files-cell { text-align: center; }
  .clip-btn { display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 5px 8px; background: #e3f2fd; color: #1976d2; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; min-width: 44px; }
  .clip-btn:hover { background: #bbdefb; }
  .clip-btn.has-files { background: #4caf50; color: white; }
  .file-badge { display: inline-block; background: white; color: #4caf50; border-radius: 10px; padding: 1px 5px; font-size: 10px; margin-left: 1px; font-weight: 700; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 12px; padding: 18px; max-width: 550px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 15px; color: #1976d2; display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; }
  .modal-close { background: none; border: none; font-size: 26px; cursor: pointer; color: #999; line-height: 1; padding: 0 5px; }

  .empty-files { text-align: center; color: #999; padding: 20px; font-style: italic; font-size: 14px; }

  .add-section { background: #f8f9ff; border-radius: 10px; padding: 12px; margin-top: 12px; border: 2px dashed #c5cae9; }
  .add-section h4 { font-size: 13px; color: #3f51b5; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .add-section input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 8px; }
  .add-section input:focus { border-color: #2196f3; }

  .save-btn { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .save-btn:hover { background: #45a049; }

  .file-card-link {
    position: relative;
    background: #f5f5f5;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
  }
  .file-card-link:hover { background: #e8eaf6; }
  .file-card-link a {
    flex: 1;
    text-decoration: none;
    color: #333;
    display: flex;
    align-items: center;
    gap: 10px;
    word-break: break-all;
  }
  .file-card-link .file-icon {
    font-size: 22px;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e3f2fd;
    border-radius: 8px;
  }
  .file-card-link .file-name {
    font-size: 14px;
    font-weight: 600;
    color: #1976d2;
  }
  .file-card-link .del-file {
    background: #ffebee;
    color: #c62828;
    border: none;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    flex-shrink: 0;
  }
  .file-card-link .del-file:hover { background: #ffcdd2; }

  .hint { text-align: center; color: #888; font-size: 12px; margin-top: 15px; }
  .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 30px; opacity: 0; transition: all 0.3s; z-index: 2000; font-size: 14px; max-width: 90%; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 600px) {
    body { padding: 8px; }
    th.time, td.time { display: none; }
    .btn { padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📚 Расписание</h1>

  <div class="date-bar">
    <input type="date" id="dateInput" onchange="onDateChange()">
    <div class="quick-btns">
      <button class="quick-btn" onclick="jumpDays(0)">Сегодня</button>
      <button class="quick-btn" onclick="jumpDays(1)">Завтра</button>
      <button class="quick-btn" onclick="jumpDays(2)">+2 дня</button>
    </div>
    <span id="statusBadge" class="status view">🔒 Просмотр</span>
  </div>

  <div class="day-label" id="dayLabel"></div>

  <div class="toolbar">
    <button class="btn btn-edit" id="editBtn" onclick="toggleEdit()">✏️ Редактировать</button>
    <button class="btn btn-primary" onclick="copyLink()">🔗 Скопировать ссылку</button>
    <button class="btn btn-danger" onclick="clearDay()">🗑 Очистить день</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="num">№</th>
          <th class="time">Время</th>
          <th>Предмет</th>
          <th>Преподаватель</th>
          <th class="room">Каб.</th>
          <th class="hw">Домашнее задание</th>
          <th class="files">📎 Файлы</th>
          <th class="act"></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8" style="text-align:center;padding:20px;color:#999;">⏳ Загрузка...</td></tr>
      </tbody>
    </table>
  </div>

  <button class="btn btn-add" id="addRowBtn" onclick="addRow()" style="display:none;">➕ Добавить строку</button>

  <p class="hint">💡 Все изменения видны всем. Через 📎 можно прикреплять ссылки на файлы</p>
</div>

<div class="modal-overlay" id="fileModal" onclick="if(event.target===this) closeFileModal()">
  <div class="modal">
    <h3><span>📎 Файлы к уроку</span><button class="modal-close" onclick="closeFileModal()">×</button></h3>
    <div id="fileList"></div>
    <div class="add-section" id="addSection">
      <h4>➕ Добавить файл</h4>
      <input type="text" id="fileName" placeholder="Название (например: Презентация к уроку)">
      <input type="url" id="fileUrl" placeholder="Ссылка https://disk.yandex.ru/... или https://drive.google.com/...">
      <button class="save-btn" onclick="addLinkFile()">➕ Добавить ссылку</button>
      <p style="font-size:11px;color:#999;margin-top:8px;text-align:center;">
        💡 Загрузи файл на Яндекс.Диск или Google Drive → скопируй ссылку → вставь сюда
      </p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== КОНФИГ ====================
const JSONBIN_BIN_ID = '6abf01bcac6210605a0ad3f3';
const JSONBIN_KEY    = '$2a$10$CCKHnFj4se1MLUZunO02rea9BliVKGKGzUIFuZhnw4.CzAhQeAkVW';
const PASSWORD       = '1234';
const JSONBIN_URL    = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

// ==================== СОСТОЯНИЕ ====================
let editMode = false;
let currentDate = toLocalISO(new Date());
let data = {};
let currentFileRowIdx = null;
let saveTimer = null;

const DAY_NAMES = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

function toLocalISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getDayName(dateStr) {
  return DAY_NAMES[new Date(dateStr + 'T00:00:00').getDay()];
}
function defaultRows() {
  return [
    { time: '08:30–10:00', subject: '', teacher: '', room: '', hw: '', files: [] },
    { time: '10:10–11:40', subject: '', teacher: '', room: '', hw: '', files: [] },
    { time: '12:10–13:40', subject: '', teacher: '', room: '', hw: '', files: [] },
    { time: '14:00–15:30', subject: '', teacher: '', room: '', hw: '', files: [] }
  ];
}
function ensureDay(dateStr) {
  if (!data[dateStr]) data[dateStr] = defaultRows();
  data[dateStr].forEach(r => { if (!r.files) r.files = []; });
}

// ==================== ЗАГРУЗКА ====================
async function loadFromServer() {
  try {
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const rec = json.record;
    data = (rec && rec.schedule) ? rec.schedule : {};
  } catch(e) {
    console.error(e);
    showToast('⚠️ Не удалось загрузить');
    try {
      const local = localStorage.getItem('rasp_local_v4');
      if (local) data = JSON.parse(local);
    } catch(_) { data = {}; }
  }
  ensureDay(currentDate);
  render();
}

// ==================== СОХРАНЕНИЕ ====================
function save() {
  try {
    localStorage.setItem('rasp_local_v4', JSON.stringify(data));
  } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToServer, 800);
}

async function pushToServer() {
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ schedule: data })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    console.log('✅ Сохранено');
  } catch(e) {
    console.error(e);
    showToast('⚠️ Не сохранилось на сервер');
  }
}

// ==================== ОТРИСОВКА ====================
function render() {
  ensureDay(currentDate);
  const rows = data[currentDate];
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  rows.forEach((row, i) => {
    const filesCount = (row.files || []).length;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="num">${i + 1}</td>
      <td class="time"><input class="cell-input" ${editMode ? '' : 'readonly'} value="${esc(row.time)}" oninput="updateField(${i}, 'time', this.value)" placeholder="—"></td>
      <td><input class="cell-input" ${editMode ? '' : 'readonly'} value="${esc(row.subject)}" oninput="updateField(${i}, 'subject', this.value)" placeholder="Предмет"></td>
      <td><input class="cell-input" ${editMode ? '' : 'readonly'} value="${esc(row.teacher)}" oninput="updateField(${i}, 'teacher', this.value)" placeholder="ФИО"></td>
      <td class="room"><input class="cell-input" ${editMode ? '' : 'readonly'} value="${esc(row.room)}" oninput="updateField(${i}, 'room', this.value)" placeholder="—" style="text-align:center;"></td>
      <td class="hw"><textarea class="cell-input" ${editMode ? '' : 'readonly'} oninput="updateField(${i}, 'hw', this.value); autoGrow(this)" placeholder="Что задали?">${esc(row.hw)}</textarea></td>
      <td class="files-cell">
        <button class="clip-btn ${filesCount > 0 ? 'has-files' : ''}" onclick="openFileModal(${i})">
          📎${filesCount > 0 ? `<span class="file-badge">${filesCount}</span>` : ''}
        </button>
      </td>
      <td><button class="del-btn ${editMode ? '' : 'hidden'}" onclick="delRow(${i})">×</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll('textarea.cell-input').forEach(t => autoGrow(t));
  document.getElementById('dayLabel').textContent = '📅 ' + getDayName(currentDate) + ', ' + formatDate(currentDate);
  document.getElementById('dateInput').value = currentDate;
  document.getElementById('addRowBtn').style.display = editMode ? 'block' : 'none';

  const badge = document.getElementById('statusBadge');
  badge.textContent = editMode ? '✏️ Редактирование' : '🔒 Просмотр';
  badge.className = 'status ' + (editMode ? 'edit' : 'view');

  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✅ Готово' : '✏️ Редактировать';
  btn.classList.toggle('on', editMode);
  document.body.classList.toggle('edit-mode', editMode);
  updateQuickButtons();
}

function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function updateQuickButtons() {
  const today = toLocalISO(new Date());
  const t = toLocalISO(new Date(Date.now() + 86400000));
  const d2 = toLocalISO(new Date(Date.now() + 2*86400000));
  const btns = document.querySelectorAll('.quick-btn');
  btns.forEach(b => b.classList.remove('active'));
  if (currentDate === today) btns[0].classList.add('active');
  else if (currentDate === t) btns[1].classList.add('active');
  else if (currentDate === d2) btns[2].classList.add('active');
}
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// ==================== ДЕЙСТВИЯ ====================
function updateField(idx, field, value) {
  if (!editMode) return;
  data[currentDate][idx][field] = value;
  save();
}
function addRow() {
  if (!editMode) return;
  data[currentDate].push({ time: '', subject: '', teacher: '', room: '', hw: '', files: [] });
  save(); render();
}
function delRow(idx) {
  if (!editMode) return;
  if (!confirm('Удалить строку?')) return;
  data[currentDate].splice(idx, 1);
  save(); render();
}
function jumpDays(offset) {
  currentDate = toLocalISO(new Date(Date.now() + offset * 86400000));
  ensureDay(currentDate); render();
}
function onDateChange() {
  const nd = document.getElementById('dateInput').value;
  if (!nd) return;
  currentDate = nd;
  ensureDay(currentDate);
  render();
}
function toggleEdit() {
  if (!editMode) {
    const pass = prompt('🔐 Пароль:');
    if (pass === null) return;
    if (pass !== PASSWORD) { showToast('❌ Неверный пароль'); return; }
  }
  editMode = !editMode;
  render();
  showToast(editMode ? '✏️ Можно редактировать' : '🔒 Просмотр');
}
function clearDay() {
  if (!editMode) { showToast('🔒 Включи редактирование'); return; }
  if (!confirm('Очистить день?')) return;
  data[currentDate] = defaultRows();
  save(); render();
  showToast('🗑 Очищено');
}
function copyLink() {
  const url = location.origin + location.pathname;
  navigator.clipboard.writeText(url)
    .then(() => showToast('🔗 Ссылка скопирована!'))
    .catch(() => prompt('Скопируй:', url));
}

// ==================== ФАЙЛЫ (ССЫЛКИ) ====================
function openFileModal(idx) {
  currentFileRowIdx = idx;
  const row = data[currentDate][idx];
  if (!row.files) row.files = [];
  document.getElementById('fileName').value = '';
  document.getElementById('fileUrl').value = '';
  document.getElementById('addSection').style.display = editMode ? 'block' : 'none';
  renderFileList();
  document.getElementById('fileModal').classList.add('show');
}
function closeFileModal() {
  document.getElementById('fileModal').classList.remove('show');
  currentFileRowIdx = null;
}
function renderFileList() {
  const row = data[currentDate][currentFileRowIdx];
  const list = document.getElementById('fileList');
  if (!row.files || row.files.length === 0) {
    list.innerHTML = '<div class="empty-files">📭 Пока нет файлов</div>';
    return;
  }
  list.innerHTML = '';
  row.files.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'file-card-link';
    card.innerHTML = `
      <a href="${esc(f.url)}" target="_blank" rel="noopener">
        <div class="file-icon">🔗</div>
        <div class="file-name">${esc(f.name)}</div>
      </a>
      ${editMode ? `<button class="del-file" onclick="removeFile(${i})">×</button>` : ''}
    `;
    list.appendChild(card);
  });
}
function addLinkFile() {
  const name = document.getElementById('fileName').value.trim();
  const url = document.getElementById('fileUrl').value.trim();
  if (!name || !url) { showToast('Заполни оба поля'); return; }
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    showToast('Ссылка должна начинаться с http');
    return;
  }
  const row = data[currentDate][currentFileRowIdx];
  if (!row.files) row.files = [];
  row.files.push({ name, url });
  save();
  document.getElementById('fileName').value = '';
  document.getElementById('fileUrl').value = '';
  renderFileList();
  render();
  showToast('🔗 Ссылка добавлена');
}
function removeFile(i) {
  if (!editMode) return;
  if (!confirm('Удалить ссылку?')) return;
  data[currentDate][currentFileRowIdx].files.splice(i, 1);
  save(); renderFileList(); render();
}

// ==================== УТИЛИТЫ ====================
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// СТАРТ
loadFromServer();
</script>
</body>
</html>
